## 2. Kinematics, Drag Physics & Aerodynamic Lift Formulas

Minecraft Elytra dynamics operate on a discrete per-tick ($1\\text{ tick} = 0.05\\text{ seconds}$) velocity update loop.

### Vector Kinetic Mechanics

Let $\\vec{v}_t = (v_x, v_y, v_z)$ be the current velocity vector at tick t, and $\\vec{d} = (d_x, d_y, d_z)$ be the unit orientation vector derived from pitch $\\theta$ and yaw $\\phi$:

$$d_x = -\\sin(\\phi) \\cdot \\cos(\\theta)$$
$$d_y = -\\sin(\\theta)$$
$$d_z = \\cos(\\phi) \\cdot \\cos(\\theta)$$

### Drag & Velocity Updates

At each tick t, velocity decays by drag constant $k_d = 0.99$ prior to pitch modifier calculations:

$$\\vec{v}_{\\text{drag}} = \\vec{v}_t \\cdot 0.99$$

Vertical acceleration due to gravity $g = 0.08\\text{ blocks/tick}^2$ acts on $v_y$:

$$v_{y, \\text{gravity}} = v_{y, \\text{drag}} - 0.08$$

### Aerodynamic Lift Force Model

The horizontal direction vector magnitude $h = \\sqrt{d_x^2 + d_z^2}$. The dynamic lift parameter $C_L$ is computed as a function of pitch angle $\\theta$:

$$C_L = \\cos(\\theta) \\cdot \\min\\left(1.0, \\frac{\\Vert{}\\vec{v}_t\\Vert{}^2}{1.0}\\right)$$

$$v_{y, \\text{lift}} = v_{y, \\text{gravity}} + \\left(d_y \\cdot \\sqrt{v_x^2 + v_z^2} \\cdot 0.1 \\cdot C_L\\right)$$

The horizontal components gain velocity converted from vertical falling energy:

$$v_{x, \\text{final}} = v_{x, \\text{drag}} + \\left(d_x \\cdot \\frac{v_{y, \\text{lift}}}{h} \\cdot 0.1 \\cdot C_L\\right)$$

$$v_{z, \\text{final}} = v_{z, \\text{drag}} + \\left(d_z \\cdot \\frac{v_{y, \\text{lift}}}{h} \\cdot 0.1 \\cdot C_L\\right)$$

### Optimal Glide & Energy Cruise Equations

* **Maximum Range Cruise Sine Wave:** Oscillate pitch between $\\theta_{\\text{down}} = +0.18\\text{ rad}$ ($\\approx 10.3^\\circ$) to build momentum, and $\\theta_{\\text{up}} = -0.15\\text{ rad}$ ($\\approx -8.6^\\circ$) to convert kinetic energy back to potential altitude.
* **Dead-Stick Glide Pitch:** Absolute minimum drag-to-lift loss occurs at a static pitch setting of:

$$\\theta_{\\text{glide}} = +0.02\\text{ rad} \\quad (\\approx +1.15^\\circ)$$

## 3. Pre-Flight Volumetric Auditing & Fallback Ground Navigation

### 3D Volumetric Ray-Box Launch Audit

Before initiating launch packets, the bot projects a $45^\\circ$ apex-angle clearance cone along the proposed takeoff yaw $\\phi_0$.

$$\\text{Cone}(r, \\alpha) = \\left\\{ \\vec{p} \\in \\mathbb{R}^3 \\; \\middle\\vert \\; \\Vert{}\\vec{p} - \\vec{p}_0\\Vert{} \\le r, \\, \\frac{(\\vec{p} - \\vec{p}_0) \\cdot \\vec{d}_{\\text{launch}}}{\\Vert{}\\vec{p} - \\vec{p}_0\\Vert{}} \\ge \\cos(\\alpha) \\right\\}$$

Where $r = 16\\text{ blocks}$ and $\\alpha = 22.5^\\circ$. Every voxel intersecting this cone must evaluate to Air or Passable (e.g., short grass, saplings).

\`\`\`
                      / Launch Vector
                     /

    [Bot]---------->---------> Clearance Check Cone (16m)

                     \\
                      \\
\`\`\`

2. **Off-Hand Priority Logic:**

### Ground Pathfinding Relocation Fallback

If the volumetric raycast returns a collision intersection ($I_{\\text{count}} > 0$):

1. **Local Grid Scan:** Instantiate an $11 \\times 5 \\times 11$ local bounding grid around $\\vec{p}_0$.
2. **Elevated Node Search:** Filter for solid ground blocks with $\\ge 3$ open air blocks vertically above them, minimizing $D(\\vec{p}) = \\Vert{}\\vec{p} - \\vec{p}_{\\text{target}}\\Vert{} - 2.0 \\times Y_{\\text{node}}$.
3. **A* Navigation:** Execute a short-range A* ground pathing loop using step, jump, and ladder-climb nodes until arriving at selected elevated coordinate. Re-trigger AUDIT.

## 4. Anti-Cheat Humanization & Cubic Bezier Camera Mechanics

To bypass server-side heuristic anti-cheat flags (e.g., GroundedLook, ImpossibleRotation, AimAnalysis), look-vector changes are generated using parametric Cubic Bézier curves with procedural Gaussian noise injection.

\`\`\`
       Control Point P1 (Noise Offset)
            o . . . . . o Control Point P2
           .             .
          .               .
    P0 o--                 --o P3 (Target Orientation)
  (Current)
\`\`\`

### Parametric Curve Definition

$$\\vec{B}(t) = (1-t)^3 \\vec{P}_0 + 3(1-t)^2 t \\vec{P}_1 + 3(1-t) t^2 \\vec{P}_2 + t^3 \\vec{P}_3, \\quad t \\in [0, 1]$$

* $\\vec{P}_0 = (\\phi_{\\text{start}}, \\theta_{\\text{start}})$: Initial orientation.
* $\\vec{P}_3 = (\\phi_{\\text{target}}, \\theta_{\\text{target}})$: Desired target orientation.
* $\\vec{P}_1, \\vec{P}_2$: Intermediate control points offset by an orthogonal perturbation vector scaled by rotation magnitude:

$$\\vec{P}_1 = \\vec{P}_0 + \\frac{1}{3}(\\vec{P}_3 - \\vec{P}_0) + \\mathcal{N}(0, \\sigma^2) \\cdot \\hat{n}$$
$$\\vec{P}_2 = \\vec{P}_0 + \\frac{2}{3}(\\vec{P}_3 - \\vec{P}_0) + \\mathcal{N}(0, \\sigma^2) \\cdot \\hat{n}$$

Where $\\sigma = 0.03\\text{ rad}$ and $\\hat{n}$ is the unit normal vector to the rotation axis.

### Rotational Constraints & Slew Rate Limits

Per tick delta angle ($\\Delta\\phi, \\Delta\\theta$) is strictly clamped to simulate human neck muscle inertia:

$$|\\Delta\\phi_{\\text{tick}}| \\le 0.35\\text{ rad/tick} \\quad (\\approx 20.0^\\circ/\\text{tick})$$
$$|\\Delta\\theta_{\\text{tick}}| \\le 0.26\\text{ rad/tick} \\quad (\\approx 15.0^\\circ/\\text{tick})$$

### Packet Stream Regulation

Rotation updates are sent via PlayerPositionAndLook or PlayerLook client packets at a regular frequency, perturbed by micro-jitter delays ($\\Delta t_{\\text{packet}} = 50\\text{ms} \\pm \\mathcal{U}(-4\\text{ms}, +6\\text{ms})$) to break non-human periodic signatures.

## 5. Airborne Navigation, Chunk Throttling & Network Sync

### Sine-Wave Distance Cruise Algorithm

To maximize distance traveled per firework rocket, EAFE-v7 uses an alternating energy glide pitch system:

\`\`\`
Altitude Y
    ^       Pitch Down (+0.18 rad) -> Build Velocity
    |       \\  
    |        \\          Pitch Up (-0.15 rad) -> Gain Altitude
    |         \\        /
    |          \\______/
    +----------------------------------------------------> Distance X/Z
\`\`\`

1. **Boost Phase:** Firework rocket deployed $\\rightarrow$ Lock pitch $\\theta = -0.08\\text{ rad}$ until $v_h \\ge 1.6\\text{ blocks/tick}$.
2. **Glide Phase (Pitch Down):** Set $\\theta = +0.18\\text{ rad}$ until Y drops below $Y_{\\text{cruise\\_min}}$ or $v_h \\ge 2.2\\text{ blocks/tick}$.
3. **Ascent Phase (Pitch Up):** Set $\\theta = -0.15\\text{ rad}$ to convert $v_h$ back into Y until $v_h \\le 0.8\\text{ blocks/tick}$.
4. **Repeat Cycle:** Re-engage rocket only when total velocity $\\Vert{}\\vec{v}\\Vert{} < 0.6\\text{ blocks/tick}$ and $Y \\le Y_{\\text{cruise\\_target}}$.

### Dynamic Chunk Throttling Protocol

Target velocity $v_{\\text{target}}$ is dynamically bounded by the client's current chunk loading radius $R_{\\text{loaded}}$:

$$v_{\\text{max\\_permitted}} = \\min\\left(2.5, \\, 0.25 \\times R_{\\text{loaded}}\\right)\\text{ blocks/tick}$$

If $R_{\\text{loaded}} < 3\\text{ chunks}$, set pitch to thermal glide pitch $\\theta = +0.02\\text{ rad}$ and zero out horizontal rocket consumption.

### Network Latency vs. Server TPS Desync Classifier

To prevent rubberbanding and false stall detections, network conditions are split into two metrics:

\`\`\`
                       [NETWORK TELEMETRY]
                                |
             +------------------+------------------+
             |                                     |
      Ping > 350ms                          TPS < 12.0
   (Network Spike)                      (Server Engine Lag)
             |                                     |
    - Suppress Position Packets           - Transition to STALL_ORBIT
    - Maintain Extrapolated Motion        - Lock Yaw, Pitch = +0.05 rad
    - Freeze Navigation State             - Halt Firework Consumption
\`\`\`

## 6. Threat Evasion Engine (Player Proximity & Hostile Entity Evasion)

### 128m Player Radar Detection Vector

A continuous spatial search runs on every tick over all entity tracking tables:

$$d_{\\text{player}} = \\sqrt{(x_p - x_b)^2 + (y_p - y_b)^2 + (z_p - z_b)^2}$$

If any hostile or non-whitelisted player entity satisfies $d_{\\text{player}} \\le 128.0\\text{m}$, the EVASION state triggers instantly.

\`\`\`
 Threat Player Detected (<128m)
            \\
             \\ Pitch Lock: -0.8 rad (~ -45.8°)
              \\ Rocket Boost Engaged
               \\
  ======================================= Y = 320 (Stratosphere Ceiling)
                 \\
                  \\ Trajectory Shift Angle Δφ = ±45°
                   \\_________________________________> Evasive Cruise
\`\`\`

### Stratospheric Evasion Protocol Sequence

1. **Pitch Lock:** Set pitch immediately to high angle $\\theta = -0.80\\text{ rad}$ ($\\approx -45.8^\\circ$).
2. **Thrust Sequence:** Fire $2\\times$ sequential firework rockets (delay 200ms) to force rapid vertical climb.
3. **Stratosphere Ceiling Target:** Maintain pitch lock until current altitude $Y_b \\ge 320\\text{ blocks}$ (above standard render and weapon range).
4. **Angle Offset Trajectory Shift:** Calculate evasive yaw angle $\\phi_{\\text{evade}} = \\phi_{\\text{target}} \\pm \\frac{\\pi}{4}\\text{ rad}$ ($45^\\circ$ offset relative to threat position vector) to throw off intercept trajectories.

### Airborne Hostile Entity Avoidance (Ghasts & Phantoms)

For incoming projectiles (Ghast fireballs) or airborne mob entities (Phantoms):

1. **Predict Intersect Point:** Compute minimum distance between threat trajectory line $\\vec{r}_t(k) = \\vec{p}_t + k\\vec{v}_t$ and bot position $\\vec{p}_b$.
2. **Evasive Maneuver:** If $d_{\\text{min}} < 4.0\\text{m}$ and collision time $k \\in (0, 40\\text{ ticks}]$, construct an orthogonal evasion vector $\\vec{v}_{\\text{evade}} = \\vec{v}_b \\times \\vec{v}_t$.
3. Force a $90^\\circ$ instant roll-yaw tilt along $\\vec{v}_{\\text{evade}}$ with a single rocket burst.

## 7. Nether Hazard Index & Dimension Coordinate Scaling Engine

### Nether Flight Constraints & Boundary Envelopes

Nether dimensions enforce strict vertical boundaries due to bottom bedrock/lava oceans ($Y \\le 31$) and the top bedrock ceiling ($Y \\ge 120$).

\`\`\`
===================================================== Y = 128 (Top Bedrock Roof)
     Ceiling Hazard Buffer (D_danger = 10m)
----------------------------------------------------- Y = 118 (Upper Flight Ceiling)
 
         ALLOWED NETHER FLIGHT CORRIDOR (Y: 38 - 118)
 
----------------------------------------------------- Y = 38 (Lower Flight Floor)
     Floor Hazard Buffer (D_danger = 7m)
===================================================== Y = 31 (Lava Ocean Surface)
\`\`\`

$$\\text{Safe Altitude Corridor: } Y_{\\text{Nether}} \\in [38, 118]$$

Within the Nether, pitch angle limits are compressed to prevent high-velocity vertical collisions:

$$\\theta_{\\text{Nether}} \\in [-0.20\\text{ rad}, \\, +0.10\\text{ rad}]$$

### Nether Hazard Index Computation

Every voxel node n in the forward flight path is scored using a composite hazard cost function:

$$H(n) = \\frac{w_1}{d_{\\text{lava}}^2} + \\frac{w_2}{d_{\\text{bedrock}}^2} + w_3 \\cdot \\mathbb{I}_{\\text{fire}}(n) + w_4 \\cdot \\mathbb{I}_{\\text{void}}(n)$$

* $d_{\\text{lava}}$: Distance to nearest lava source block.
* $d_{\\text{bedrock}}$: Distance to nearest bedrock block.
* $\\mathbb{I}_{\\text{fire}}$, $\\mathbb{I}_{\\text{void}}$: Indicator functions (1 if present, 0 otherwise).
* Weights: $w_1 = 100.0$, $w_2 = 80.0$, $w_3 = 50.0$, $w_4 = 200.0$.

If path node score $H(n) > 15.0$, the local trajectory planner recalculates a spline curve around the hazard region.

## 8. Archimedean Landing Scan, Surface Classifier & Dead-Stick Gliding

### Archimedean Spiral Downward Volumetric Scan

When transitioning to DESCENT ($Y_{\\text{rel}} \\le 40\\text{m}$ above target area), the bot projects down raycasts arranged in an Archimedean spiral to locate a suitable $3\\times3$ flat landing zone:

$$r(\\alpha) = a + b \\cdot \\alpha$$
$$x(\\alpha) = r(\\alpha) \\cdot \\cos(\\alpha), \\quad z(\\alpha) = r(\\alpha) \\cdot \\sin(\\alpha)$$

\`\`\`
          Top-Down Landing Raycast Pattern
                      .---.
                    .'  |  '.
                   /   .-.   \\
                  |   (   )   |  (Archimedean Spiral)
                   \\   '-'   /
                    '.     .'
                      '---'
\`\`\`

Raycast sampling parameters: $a = 0.5$, $b = 0.8$, $\\alpha \\in [0, 6\\pi]$.

### Surface Classifier Logic Table

| Ground Voxel Type | Material Properties | Friction Metric ($\\mu$) | Safety Rating | Landing Action Protocol |
|---|---|---|---|---|
| Grass / Dirt / Stone | Solid, Opaque | 0.60 | SAFE (1.0) | Direct Archimedean touchdown. |
| Water ($\\ge$ 2m depth) | Liquid | 0.80 (Damping) | SAFE (0.9) | Disengage Elytra 2m above water surface. |
| Slime Block | Solid, Elastic | 1.00 (Bouncing) | MODERATE (0.5) | Sneak key held on contact to cancel bounce. |
| Ice / Packed Ice | Solid, Low-Friction | 0.98 (Sliding) | MODERATE (0.4) | Execute post-touchdown reverse pitch braking. |
| Lava / Fire / Void | Hazard / Fatal | $\\infty$ | FATAL (0.0) | Reject landing node; offset spiral radius r + 10m. |
| Leaves / Saplings | Soft Solid | 0.30 | RISKY (0.2) | Force break block with held tool before landing. |

When firework reserves are depleted ($N_{\\text{firework}} = 0$), EAFE-v7 executes an unpowered precision touchdown:

  (1)  |\\ Glide Phase (Pitch = +0.02 rad)

        v71: `# EAFE-v7.1 Engineering Specification

**Document Standard:** Production Reference Blueprint (Vanilla Physics Compliant)
**Target Engine:** Mineflayer / Node.js (Vanilla Protocol Compliant)
**Physics Reference:** Minecraft Java Edition Decompiled Movement Loop (LivingEntity.travel)

## 1. Decompiled Vanilla Physics & Kinematics Engine

To prevent server-side rubber-banding and position prediction desync, the autopilot must execute the exact 3-step velocity update loop applied by the server on every 50ms tick (20 TPS).

\`\`\`
┌────────────────────────────────────────────────────────────────────────┐
│                   PER-TICK VELOCITY UPDATE (50ms)                      │
├────────────────────────────────────────────────────────────────────────┤
│ STEP 1: Kinetic Pitch Energy Exchange                                  │
│         ├─ If Pitch < 0 (Nose UP): Convert horizontal velocity to lift │
│         └─ If Pitch > 0 (Nose DOWN): Convert fall speed to thrust      │
│                                                                        │
│ STEP 2: Impulse, Gravity & Base Lift Addition                          │
│         ├─ Add Rocket Thrust Impulse (a_boost)                         │
│         ├─ Subtract Gravity (g = 0.08)                                 │
│         └─ Add Passive Wing Lift (cos²(pitch) * 0.06)                  │
│                                                                        │
│ STEP 3: Axis-Decoupled Drag Scaling                                    │
│         ├─ Horizontal Vector (X, Z) * 0.99                             │
│         └─ Vertical Vector (Y) * 0.98                                  │
└────────────────────────────────────────────────────────────────────────┘
\`\`\`

### 1.1 Step 1: Kinetic Pitch Energy Exchange Formula

Let $\\phi$ be the camera pitch angle in radians ($\\phi < 0$ is nose UP, $\\phi > 0$ is nose DOWN), and $v_h = \\sqrt{v_x^2 + v_z^2}$ be the horizontal speed.

**Scenario A: Pitching Nose-UP ($\\phi < 0$)**

Horizontal momentum is converted into vertical climbing momentum:

$$\\Delta v_y = v_h \\cdot (-\\sin\\phi) \\cdot 0.04$$
$$\\Delta v_x = -v_x \\cdot (-\\sin\\phi) \\cdot 0.04$$
$$\\Delta v_z = -v_z \\cdot (-\\sin\\phi) \\cdot 0.04$$

**Scenario B: Diving Nose-DOWN ($\\phi > 0$ and $v_y < 0$)**

Gravitational downward falling speed is converted into horizontal forward thrust:

$$\\Delta v_x = \\left(\\frac{v_x}{v_h}\\right) \\cdot (-v_y) \\cdot \\cos^2\\phi \\cdot 0.1$$
$$\\Delta v_z = \\left(\\frac{v_z}{v_h}\\right) \\cdot (-v_y) \\cdot \\cos^2\\phi \\cdot 0.1$$
$$\\Delta v_y = 0$$

### 1.2 Step 2: Rocket Impulse, Gravity & Base Lift

Combine current velocity $\\vec{v}$, pitch exchange delta $\\vec{\\Delta v}$, firework boost impulse $\\vec{a}_{\\text{boost}}$, base gravity (0.08), and passive wing lift ($\\cos^2\\phi \\cdot 0.06$):

$$v_x' = v_x + \\Delta v_x + a_{\\text{boost}, x}$$
$$v_z' = v_z + \\Delta v_z + a_{\\text{boost}, z}$$
$$v_y' = v_y + \\Delta v_y - 0.08 + (\\cos^2\\phi \\cdot 0.06) + a_{\\text{boost}, y}$$

### 1.3 Step 3: Axis-Decoupled Drag Scaling

Apply axis-decoupled drag multipliers to produce the final tick velocity vector $\\vec{v}_{t+1}$:

$$v_{x, t+1} = v_x' \\cdot 0.99$$
$$v_{z, t+1} = v_z' \\cdot 0.99$$
$$v_{y, t+1} = v_y' \\cdot 0.98$$

**Critical Distinction:** Horizontal drag ($D_h = 0.99$) and vertical drag ($D_v = 0.98$) are non-identical. Unified 0.99 drag assumptions accumulate vertical position drift over long distances.

## 2. Navigation Vectors & Fuel Calculation

### 2.1 Target Angle Calculations

Given bot position $\\mathbf{P}_b = (x_b, y_b, z_b)$ and target position $\\mathbf{P}_t = (x_t, y_t, z_t)$:

$$\\text{2D Horizontal Distance } (d_{2D}) = \\sqrt{(x_t - x_b)^2 + (z_t - z_b)^2}$$
$$\\text{Target Yaw } (\\theta) = \\operatorname{atan2}(-(x_t - x_b), z_t - z_b)$$
$$\\text{Target Pitch } (\\phi) = \\operatorname{atan2}(y_t - y_b, d_{2D})$$

Convention Note: In Mineflayer, pitch $\\phi = -1.57\\text{ rad}$ is straight UP, $\\phi = 0\\text{ rad}$ is horizontal, and $\\phi = +1.57\\text{ rad}$ is straight DOWN.

### 2.2 Fuel Requirement Equation

Total duration-1 fireworks required ($N_{\\text{rockets}}$) before approving launch:

$$N_{\\text{rockets}} = \\left\\lceil \\frac{d_{2D}}{68.5} \\right\\rceil + \\left\\lceil \\frac{|Y_{\\text{cruise}} - Y_{\\text{start}}|}{28.0} \\right\\rceil + 15$$

Where 15 represents the mandatory safety buffer reserved for landing re-routes and emergency climbs.

## 3. Ground Takeoff Mechanics & Spatial Envelope

### 3.1 The 150ms Jump Apex Rule

Vanilla servers reject the START\\_FALL\\_FLYING client packet if received while the entity bounding box touches the ground (onGround === true).

\`\`\`
  Tick 0: Jump Triggered       Tick 3-4 (150ms-200ms)          Tick 7+: Falling
  onGround = true               onGround = false (Apex)         Velocity dropping
  ❌ PACKET REJECTED            ✅ OPTIMAL PACKET WINDOW        ⚠️ STALL / DANGEROUS
\`\`\`

1. Tick 0: Execute sprint = true, forward = true, jump = true.
2. Tick 3–4 (150ms–200ms delay): Entity reaches vertical jump apex ($v_y \\approx 0$, onGround = false). Release jump.
3. Tick 4: Send START\\_FALL\\_FLYING packet (bot.elytraFly()).
4. Tick 5: Pitch camera up to $\\phi = -0.52\\text{ rad}$ ($\\approx -30^\\circ$) and fire rocket #1.

### 3.2 3D Spatial Envelope Pre-Flight Check

Takeoff is prohibited unless the surrounding block volume passes a three-zone scan:

| Scan Zone | Dimension Bound | Required Block Type |
|---|---|---|
| Overhead Column | $1 \\times 1 \\times 5$ blocks (Y+1 $\\rightarrow$ Y+5) | air / cave\\_air |
| Forward Runway | $1 \\times 2 \\times 4$ blocks along departure Yaw | air / cave\\_air |
| Lateral Spacing | $3 \\times 2 \\times 1$ blocks at shoulder height | air / cave\\_air |

**Failure Protocol:** If any clearance scan fails, abort takeoff and pathfind on foot to open ground.

## 4. Chunk Streaming, Network Sync & Hysteresis Logic

### 4.1 Chunk Loading "Wall of Death" Mitigation

Flying into unloaded chunks causes position freezing and packet drops. The bot projects its velocity vector 30 blocks ahead to verify chunk load status.

To prevent rapid toggling between cruising and stalling at chunk boundaries, state transitions use **Hysteresis Thresholds:**

\`\`\`
          ┌─────────────────────────────────────────┐
          │ Evaluate Unloaded Chunks 30m Ahead (R) │
          └────────────────────┬────────────────────┘
                               │
          ┌────────────────────┴────────────────────┐
          │        State Machine Check              │
          └────────────────────┬────────────────────┘
                               │
   ┌───────────────────────────┴───────────────────────────┐
[ In CRUISE Mode? ]                                 [ In STALL_ORBIT Mode? ]
   │                                                       │
  [ Is R < 10 Chunks? ]                                   [ Is R ≥ 16 Chunks? ]
     /           \\                                           /           \\
   YES            NO                                       YES            NO
   /               \\                                       /               \\
Enter           Maintain                                 Exit            Maintain
STALL_ORBIT     CRUISE                                   STALL_ORBIT     STALL_ORBIT
\`\`\`

* **STALL\\_ORBIT Protocol:** Cease firework activations, pitch UP to +0.3 rad ($\\approx +17^\\circ$), and bank in a 20m radius orbit over loaded terrain until chunk availability $\\ge 16$.

### 4.2 TPS Desync Protection

* **Monitor:** Track server keep-alive packet frequency.
* **Action:** If calculated server TPS drops below 12.0, freeze rocket activations. Allow kinetic gliding until server tick frequency normalizes.

## 5. Dimension Corridors & Nether Hazard Index

### 5.1 Dimension Flight Altitudes

| Dimension | Safe Cruise Corridor (Y) | Primary Risk Mitigation |
|---|---|---|
| Overworld | Y = 280 - 320 | Sits above player entity render bubble (128m). |
| Nether Roof | Y = 180 - 240 | Flies in open space above bedrock ceiling (Y = 128). |
| Nether Caves | Restricted / Low Altitude | Subject to Hazard Index Calculation + Operator Intercept. |
| The End | Y = 120 - 160 | Avoids obsidian towers while maintaining clearance over void. |

### 5.2 Nether Under-Roof Hazard Index Algorithm

When instructed to fly in the Nether below bedrock ceiling (Y < 128), the bot calculates the Corridor Hazard Index (H) before launching:

$$H = \\left( \\frac{N_{\\text{lava}} + 2 \\cdot N_{\\text{obstacle}}}{N_{\\text{scanned}}} \\right) \\times 100\\%$$

Where:
* $N_{\\text{lava}}$ = Surface blocks along the flight corridor consisting of liquid lava.
* $N_{\\text{obstacle}}$ = Solid blocks intersecting a 5-block clearance corridor along the vector.
* $N_{\\text{scanned}}$ = Total evaluated blocks along the trajectory.

**Permission Threshold:** If H > 30%, flight is suspended. The bot issues a warning to chat/console and waits 30 seconds for operator confirmation (confirm) before launching.

## 6. Air-Braking, Surface Classifier & Touchdown

\`\`\`
                   CRUISE PHASE (Speed ~30 m/s)

                                                  │ Enter 60m Arrival Zone
                                                  ▼

                                       │  SPIRAL AIR-BRAKING  │
                                       │  Radius: 15-20m      │
                                       │  Pitch: +0.25 rad    │
                                       └──────────┬───────────┘
                                                  │ Speed < 8 m/s
                                                  ▼
                                       ┌──────────────────────┐
                                       │ SURFACE VALIDATION   │
                                       │ Raycast Below        │
                                       └──────────┬───────────┘
                                                  │
                                   ┌──────────────┴──────────────┐
                                   │ Is Surface Safe Solid Block?│
                                   └──────────────┬──────────────┘
                                                  │

                       YES                                                 NO
                        │                                                   │
           ┌────────────┴───────────┐                          ┌────────────┴───────────┐
           │ SOFT FLARE TOUCHDOWN   │                          │ SPIRAL RADIAL SEARCH   │
           │ Pitch: +0.10 rad       │                          │ Re-route to Safe Block │
           └────────────────────────┘                          └────────────────────────┘
\`\`\`

### 6.1 Surface Classifier Matrix

* **Blacklisted Surfaces:** water, lava, air, fire, magma\\_block, cactus, sweet\\_berry\\_bush, powder\\_snow, cobweb.
* **Whitelisted Surfaces:** grass\\_block, dirt, stone, cobblestone, obsidian, netherrack, end\\_stone, planks, concrete.

### 6.2 Archimedean Spiral Landing Re-routing

If target landing coordinates reside over a blacklisted surface, execute an expanding 2D spiral search ($R = 1 \\rightarrow 25\\text{ blocks}$) to locate a safe landing pad:

$$x_{\\text{search}}(\\theta) = x_{\\text{target}} + (a + b \\cdot \\theta) \\cos(\\theta)$$
$$z_{\\text{search}}(\\theta) = z_{\\text{target}} + (a + b \\cdot \\theta) \\sin(\\theta)$$

Where $a = 1.0$ and $b = 0.5$. Lock onto the first whitelisted block with 2 blocks of clear head-space above it.

### 6.3 Soft Flare Touchdown

When $Y_{\\text{bot}} \\le Y_{\\text{ground}} + 8\\text{ blocks}$:

1. Pitch is pulled up to $\\phi = -0.10\\text{ rad}$ (Nose UP).
2. Vertical downward speed drops below $0.2\\text{ blocks/tick}$ for a zero-damage touchdown.

## 7. State Machine (FSM) & Fail-Safe Recovery Matrix

### 7.1 Finite State Machine Transitions

| State Name | Primary Action | Exit Condition | Next State |
|---|---|---|---|
| IDLE | Standby; audit gear and spatial bounds. | Command received & audit pass. | TAKEOFF |
| TAKEOFF | Execute 150ms apex jump + wing packet. | elytraFlying === true. | STEEP\\_CLIMB |

        audit: `# AUDIT.md — Full Technical Audit of EAFE-v7 and EAFE-v7.1

**Date:** 2026-07-26
**Auditor:** opencode (automated)
**Scope:** EAFE-v7.md (Master Architecture Specification), EAFE-v7.1.md (Engineering Specification beta)

---

## Executive Summary

| Severity | Count |
|----------|-------|
| HIGH     | 2     |
| MEDIUM   | 5     |
| LOW      | 9     |
| INFO     | 6     |
| N/A      | 1     |
| **Total**| **23**|

v7.1 supersedes v7 on all physics-correctness issues. v7 appears to be a reference/design document; v7.1 is the production-grade spec. The main risks are: (1) the two versions diverge without explicit cross-reference, (2) the RECOVERY FSM state in v7.1 has no defined next-state, and (3) anti-cheat Bézier PRNG is unspecified.

---

## 1. Physics Correctness

### PHYS-001: Unified drag constant in v7 is incorrect
- **Severity:** HIGH
- **Location:** EAFE-v7.md:59-67
- **Description:** v7 applies $k_d = 0.99$ uniformly to all axes (line 60: $v_{\\text{drag}} = v_t \\cdot 0.99$). Vanilla \`LivingEntity.travel\` uses 0.99 for horizontal (X, Z) and 0.98 for vertical (Y). This causes vertical position drift over long distances — the bot descends slower than vanilla, accumulating error.
- **Recommendation:** Document that v7.1 supersedes v7's drag model. The v7 spec should carry a deprecation note or be treated as reference-only.

### PHYS-002: v7 lift coefficient formula has no physical basis
- **Severity:** HIGH
- **Location:** EAFE-v7.md:64-67
- **Description:** v7 defines $C_L = \\cos(\\theta) \\cdot \\min(1.0, \\Vert v \\Vert^2 / 1.0)$ and then feeds it into a custom lift/drag redistribution model (lines 65-67). This formula has no correspondence to vanilla elytra mechanics. The min(1.0, v²/1.0) term means $C_L$ saturates at speed = 1.0 blocks/tick, which is arbitrary. The 0.1 scaling factor on lift (line 65) is also undocumented.
- **Recommendation:** v7.1's $\\cos^2(\\phi) \\cdot 0.06$ passive wing lift is the correct vanilla decomposition. v7's $C_L$ formula should be marked as superseded.

### PHYS-003: Passive wing lift present only in v7.1
- **Severity:** INFO (correct in v7.1)
- **Location:** EAFE-v7.1.md:16, 32
- **Description:** v7.1 adds $\\cos^2(\\phi) \\cdot 0.06$ as a passive wing lift term in Step 2. This matches vanilla's per-tick lift decomposition and is absent from v7. This is a correctness improvement, not a bug.
- **Recommendation:** None. v7.1 is correct.

### PHYS-004: Pitch energy exchange differs between versions
- **Severity:** INFO
- **Location:** EAFE-v7.md:64-67, EAFE-v7.1.md:22-29
- **Description:** v7 uses a single $C_L$ formula to handle lift. v7.1 decomposes this into two explicit scenarios: nose-up (horizontal-to-vertical conversion) and nose-down (fall-to-thrust conversion), with different coefficients (0.04 vs 0.1). v7.1 is more physically accurate.
- **Recommendation:** None. v7.1 is the improved model.

---

## 2. Formula Consistency Between Versions

### CONSIST-001: Drag model contradicts between versions
- **Severity:** HIGH (subsumed by PHYS-001)
- **Location:** EAFE-v7.md:59-60, EAFE-v7.1.md:18-21
- **Description:** v7 applies uniform 0.99 drag. v7.1 uses axis-decoupled 0.99 (horizontal) / 0.98 (vertical). These produce numerically different results. The critical distinction note on v7.1:36 explicitly calls out this drift.
- **Recommendation:** Note in README that v7.1 is the authoritative physics model.

### CONSIST-002: Lift model superseded
- **Severity:** MEDIUM
- **Location:** EAFE-v7.md:64-67, EAFE-v7.1.md:16, 31-32
- **Description:** v7's $C_L$ formula is replaced by v7.1's decomposed pitch exchange + passive wing lift. The two models produce different velocity vectors for the same inputs.
- **Recommendation:** Note supersession in cross-reference table.

### CONSIST-003: Gravity consistent
- **Severity:** N/A
- **Location:** EAFE-v7.md:61, EAFE-v7.1.md:15
- **Description:** Both use $g = 0.08\\text{ blocks/tick}^2$. Consistent with vanilla decompilation.
- **Recommendation:** None.

### CONSIST-004: Velocity update ordering differs
- **Severity:** MEDIUM
- **Location:** EAFE-v7.md:59-67, EAFE-v7.1.md:5-21
- **Description:** v7 applies drag first, then gravity, then lift redistribution (lines 59-67). v7.1 applies: (1) pitch exchange, (2) gravity + impulse + lift, (3) drag. These produce different numerical outcomes even with identical coefficients, because drag applied before vs. after gravity changes the effective gravitational acceleration.
- **Recommendation:** Document that v7.1 is the authoritative update order.

### CONSIST-005: Nether hazard model differs
- **Severity:** LOW
- **Location:** EAFE-v7.md:216-221, EAFE-v7.1.md:96-102
- **Description:** v7 uses a weighted sum of inverse-square distances (H(n) formula with w₁..w₄ weights). v7.1 uses a percentage-based ratio ($N_{\\text{lava}} + 2 \\cdot N_{\\text{obstacle}}) / N_{\\text{scanned}}$). The v7.1 model is simpler and threshold-based (H > 30% suspends flight). Different algorithms, different behavior.
- **Recommendation:** Note in cross-reference table.

---

## 3. FSM Completeness

### FSM-001: RECOVERY state has no defined next-state
- **Severity:** MEDIUM
- **Location:** EAFE-v7.1.md:152
- **Description:** The RECOVERY row in the FSM table (line 152) shows empty cells in the "Next State" column. The exit condition text reads "Flight restored -> CRUISE; Ground reached -> TAKEOFF" but the Next State column itself is blank. This is ambiguous — does the state self-transition, or is the table incomplete?
- **Recommendation:** Fill in explicit next-state entries: "Flight restored -> CRUISE; Ground reached -> TAKEOFF" in the Next State column.

### FSM-002: v7 FSM has 10 states, v7.1 has 7 — no reconciliation
- **Severity:** LOW
- **Location:** EAFE-v7.md:4-39, EAFE-v7.1.md:143-152
- **Description:** v7 defines IDLE, AUDIT, PRE_FLIGHT, GROUND_PATHFIND, TAKEOFF, CRUISE, EVASION, DESCENT, LANDING, STALL_ORBIT (10 states). v7.1 defines IDLE, TAKEOFF, STEEP_CLIMB, CRUISE, STALL_ORBIT, DESCENT_SPIRAL, TOUCHDOWN, RECOVERY (8 states, though RECOVERY is partially defined). States like AUDIT, PRE_FLIGHT, GROUND_PATHFIND, EVASION exist only in v7. No mapping or migration note exists.
- **Recommendation:** Add a migration table in README mapping v7 states to v7.1 equivalents.

### FSM-003: No IDLE recovery path from terminal states in v7.1
- **Severity:** LOW
- **Location:** EAFE-v7.1.md:143-152
- **Description:** TOUCHDOWN transitions to IDLE (line 151), but RECOVERY's next-state is undefined. If RECOVERY is meant to be a mid-flight error recovery state, it should have explicit paths back to CRUISE or TAKEOFF as its exit condition text implies.
- **Recommendation:** Fill RECOVERY next-state as specified in FSM-001.

### FSM-004: v7 ERR_RUBBERBAND_LOOP threshold unverifiable
- **Severity:** LOW
- **Location:** EAFE-v7.md:264
- **Description:** "> 3 server position reset packets received within 10 ticks" is stated as the rubberband detection trigger. This threshold is plausible (2 resets/sec in vanilla) but cannot be verified against vanilla source without decompilation access. The 10-tick window at 20 TPS = 500ms.
- **Recommendation:** Flag as empirical value; verify against server source if available.

---

## 4. Anti-Cheat Logic

### ANTI-001: PRNG for Bezier perturbation unspecified
- **Severity:** LOW
- **Location:** EAFE-v7.md:120-122
- **Description:** The Gaussian noise $\\mathcal{N}(0, \\sigma^2)$ on control points P1 and P2 (lines 121-122) does not specify a PRNG algorithm or seed strategy. Different PRNGs produce different sequences, which affects anti-cheat fingerprinting. A seeded PRNG (e.g., MT19937) would make behavior reproducible for debugging.
- **Recommendation:** Specify PRNG (e.g., seeded MT19937 or crypto.getRandomValues) and seed strategy (e.g., per-session random seed).

### ANTI-002: Packet jitter is asymmetric — verify intentional
- **Severity:** LOW
- **Location:** EAFE-v7.md:127
- **Description:** Packet delay is $50\\text{ms} \\pm \\mathcal{U}(-4\\text{ms}, +6\\text{ms})$, meaning the range is [46ms, 56ms] — biased toward longer delays. This is asymmetric. Real human input jitter tends to be roughly symmetric or right-skewed. The +6ms / -4ms asymmetry may be intentional (slight bias toward longer gaps is more human-like), but it's undocumented.
- **Recommendation:** Document intent: "Asymmetric jitter biases toward longer delays to simulate human reaction latency."

### ANTI-003: Slew rate limits — verify against human neck muscle limits
- **Severity:** INFO
- **Location:** EAFE-v7.md:124-125
- **Description:** Delta yaw ≤ 0.35 rad/tick (~20 deg/tick) and delta pitch ≤ 0.26 rad/tick (~15 deg/tick). At 20 TPS, this is ~400 deg/s yaw and ~300 deg/s pitch. Professional FPS players typically achieve 200-400 deg/s yaw. The values are at the upper end of human capability but plausible for fast flick shots.

## 5. Edge Cases and Missing Failure Modes

### EDGE-001: Nether void weight disproportionate
- **Severity:** LOW
- **Location:** EAFE-v7.md:220
- **Description:** $w_4 = 200.0$ for void indicator in the Nether Hazard Index. Since void is binary (instant death), any $w_4 > 0$ would trigger avoidance. 200 inflates H(n) unnecessarily and could mask the relative importance of lava ($w_1 = 100$) and bedrock ($w_2 = 80$) proximity. A void node at distance 1 from bedrock would score $H(n) \\ge 200$, making the bedrock term ($80/d^2$) irrelevant.
- **Recommendation:** Reduce to $w_4 = 1.0$ or document that high weight ensures immediate path rerouting regardless of other hazards.

### EDGE-002: Fuel safety buffer +15 undocumented
- **Severity:** LOW
- **Location:** EAFE-v7.1.md:44
- **Description:** The fuel equation adds $+ 15$ as a "mandatory safety buffer reserved for landing re-routes and emergency climbs." This is an empirical constant. No derivation or sensitivity analysis is provided. If the bot typically needs 2-3 rockets for landing re-routes and 1-2 for emergency climbs, 15 is conservative (7-15x overhead).
- **Recommendation:** Document the derivation or at minimum the expected worst-case consumption that 15 covers.

### EDGE-003: Portal blockage timeout 60 ticks vs vanilla 80-tick cooldown
- **Severity:** LOW
- **Location:** EAFE-v7.md:267
- **Description:** v7 uses a 60-tick (3s) timeout for portal dimension shift. Vanilla has an 80-tick (4s) cooldown on portal usage after a dimension change. If the bot enters a portal at tick 0, the server won't process the shift until tick 80, but v7's fail-safe triggers at tick 60 and repositions the bot — potentially pulling it out of the portal before the shift completes.
- **Recommendation:** Increase timeout to 80-100 ticks to account for vanilla portal cooldown, or document that 60 ticks applies only to the first portal entry attempt.

### EDGE-004: TPS threshold 12.0 — verify cutoff appropriateness
- **Severity:** INFO
- **Location:** EAFE-v7.md:49, 152, EAFE-v7.1.md:87
- **Description:** Both versions use TPS < 12.0 as the threshold for entering STALL_ORBIT. Most servers run at 20 TPS. A threshold of 12 means the bot tolerates up to 40% server lag before stalling. This is aggressive — many anti-cheat systems flag erratic movement at TPS < 15. However, 12 is a reasonable threshold for vanilla servers without heavy plugins.
- **Recommendation:** None. 12.0 is a reasonable default; document that it can be tuned per-server.

### EDGE-005: v7 landing spiral parameters differ from v7.1
- **Severity:** INFO
- **Location:** EAFE-v7.md:235, EAFE-v7.1.md:136-137
- **Description:** v7 uses Archimedean spiral with a=0.5, b=0.8, alpha in [0, 6pi]. v7.1 uses a=1.0, b=0.5, R=1->25 blocks. Different spiral geometries. v7.1's spiral is more practical (expanding radius search).
- **Recommendation:** None. v7.1 is the improved model.

    function parseMarkdown(md) {
        const lines = md.split('\n');
        let html = '';
        let inCodeBlock = false;
        let inTable = false;
        let inList = false;
        let listType = '';
        let codeContent = '';
        let tableRows = [];
        let inInlineCode = false;

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function inlineFormat(s) {
            s = escapeHtml(s);
            s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            s = s.replace(/\$([^$]+)\$/g, '$$$1$$');
            return s;
        }

        function flushTable() {
            if (!inTable || tableRows.length === 0) return;
            let result = '<table>';
            const header = tableRows[0];
            result += '<thead><tr>' + header.map(c => '<th>' + inlineFormat(c.trim()) + '</th>').join('') + '</tr></thead><tbody>';
            for (let i = 2; i < tableRows.length; i++) {
                result += '<tr>' + tableRows[i].map(c => '<td>' + inlineFormat(c.trim()) + '</td>').join('') + '</tr>';
            }
            result += '</tbody></table>';
            html += result;
            tableRows = [];
            inTable = false;
        }

        function flushList() {
            if (!inList) return;
            html += listType === 'ul' ? '</ul>' : '</ol>';
            inList = false;
        }

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];

            // Fenced code blocks
            if (line.trimStart().startsWith('```')) {
                if (inCodeBlock) {
                    html += '<pre><code>' + escapeHtml(codeContent.trimEnd()) + '</code></pre>';
                    codeContent = '';
                    inCodeBlock = false;
                } else {
                    flushTable();
                    flushList();
                    inCodeBlock = true;
                }
                continue;
            }
            if (inCodeBlock) {
                codeContent += line + '\n';
                continue;
            }

            // Tables
            if (line.includes('|') && line.trim().startsWith('|')) {
                flushList();
                const cells = line.split('|').slice(1, -1);
                if (!inTable) inTable = true;
                // Skip separator row
                if (cells.every(c => /^\s*[-:]+\s*$/.test(c))) continue;
                tableRows.push(cells);
                continue;
            } else if (inTable) {
                flushTable();
            }

            // Headings
            const headingMatch = line.match(/^(#{1,6})\s+(.+)/);
            if (headingMatch) {
                flushList();
                const level = headingMatch[1].length;
                const text = headingMatch[2];
                const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');
                html += '<h' + level + ' id="' + id + '">' + inlineFormat(text) + '</h' + level + '>';
                continue;
            }

            // Horizontal rule
            if (/^---+\s*$/.test(line.trim())) {
                flushList();
                html += '<hr>';
                continue;
            }

            // Empty line
            if (line.trim() === '') {
                flushList();
                continue;
            }

            // Unordered list
            if (/^(\s*)[*\-]\s+/.test(line)) {
                flushTable();
                if (!inList || listType !== 'ul') {
                    flushList();
                    html += '<ul>';
                    inList = true;
                    listType = 'ul';
                }
                html += '<li>' + inlineFormat(line.replace(/^(\s*)[*\-]\s+/, '')) + '</li>';
                continue;
            }

            // Ordered list
            if (/^\s*\d+\.\s+/.test(line)) {
                flushTable();
                if (!inList || listType !== 'ol') {
                    flushList();
                    html += '<ol>';
                    inList = true;
                    listType = 'ol';
                }
                html += '<li>' + inlineFormat(line.replace(/^\s*\d+\.\s+/, '')) + '</li>';
                continue;
            }

            // Paragraph
            flushTable();
            flushList();
            html += '<p>' + inlineFormat(line) + '</p>';
        }

        flushTable();
        flushList();
        return html;
    }

    function generateTOC(container) {
        const toc = document.getElementById('toc');
        toc.innerHTML = '';
        const headings = container.querySelectorAll('h2, h3');
        headings.forEach(h => {
            const li = document.createElement('li');
            if (h.tagName === 'H3') li.className = 'indent';
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent;
            a.addEventListener('click', (e) => {
                e.preventDefault();
                h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                document.querySelector('aside').classList.remove('open');
            });
            li.appendChild(a);
            toc.appendChild(li);
        });
    }

    function renderContent(key) {
        const container = document.getElementById('content');
        container.innerHTML = parseMarkdown(SPECS[key]);
        generateTOC(container);

        // KaTeX
        if (typeof renderMathInElement === 'function') {
            renderMathInElement(container, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false }
                ],
                throwOnError: false
            });
        }

        // Mermaid
        if (typeof mermaid !== 'undefined') {
            mermaid.run({ nodes: container.querySelectorAll('.mermaid') }).catch(() => {});
        }
    }

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderContent(tab.dataset.tab);
        });
    });

    // Theme toggle
    const saved = localStorage.getItem('eafe-theme');
    if (saved) {
        document.documentElement.dataset.theme = saved;
        document.getElementById('theme-toggle').textContent = saved === 'dark' ? 'Light' : 'Dark';
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
        const html = document.documentElement;
        const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
        html.dataset.theme = next;
        localStorage.setItem('eafe-theme', next);
        document.getElementById('theme-toggle').textContent = next === 'dark' ? 'Light' : 'Dark';
        // Update mermaid theme
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({ startOnLoad: false, theme: next === 'dark' ? 'dark' : 'default' });
        }
    });

    // Init — wait for deferred KaTeX scripts to load
    function initApp() {
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
        renderContent('v7');

        // Scroll spy for TOC
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const link = document.querySelector('#toc a[href="#' + entry.target.id + '"]');
                if (link) {
                    if (entry.isIntersecting) {
                        document.querySelectorAll('#toc a').forEach(a => a.classList.remove('active'));
                        link.classList.add('active');
                    }
                }
            });
        }, { rootMargin: '-80px 0px -80% 0px' });

        document.querySelectorAll('#content h2, #content h3').forEach(h => observer.observe(h));
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
    </script>
